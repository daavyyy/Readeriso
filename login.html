<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js" defer></script>
  <title>Login - Readeriso</title>
</head>
<body>
  <header>
    <h1>Readeriso</h1>
  </header>

  <main>
    <section>
      <h2>Login</h2>
      <form id="formLogin">
        <input
          type="email"
          id="email"
          placeholder="E-mail"
          required
        >

        <input
          type="password"
          id="senha"
          placeholder="Senha"
          required
        >

        <button type="submit">Entrar</button>
      </form>

    </section>
  </main>
</body>
</html>
